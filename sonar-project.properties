# Community Build 26.11 анализирует одну ветку проекта.
# Workflow подставляет harness-dev, harness-stage или harness-prod.
# Адрес сервера и токен здесь не пишутся: SONAR_HOST_URL и SONAR_TOKEN.
sonar.projectKey=harness-dev
sonar.projectName=HARNESS
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
