# Встроенные allow-правила пропускают весь каталог test, любой markdown и любой путь
# со словом example, а не отдельную фикстуру. Эти строки правилами Trivy не находятся,
# поэтому правила выключены: узнаваемый секрет в тесте, документе и .env.example валит сборку.
disable-allow-rules:
  - tests
  - markdown
  - examples
